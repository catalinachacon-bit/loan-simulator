<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Simulator</title>

    <link rel="stylesheet" href="style.css">

    <script defer src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="actions.js" defer></script>
</head>
<body>
    <svg hidden xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs>
            <symbol id="loan-icon" viewBox="0 0 24 24">
                <path d="M3 10h18L12 3 3 10ZM5 10v10m5-10v10m4-10v10m5-10v10M3 21h18"/>
            </symbol>
            <symbol id="percent-icon" viewBox="0 0 24 24">
                <path d="m5 19 14-14"/>
                <circle cx="7" cy="7" r="3"/>
                <circle cx="17" cy="17" r="3"/>
            </symbol>
            <symbol id="calendar-icon" viewBox="0 0 24 24">
                <rect x="3" y="5" width="18" height="16" rx="2"/>
                <path d="M7 3v4m10-4v4M3 11h18"/>
            </symbol>
            <symbol id="calculator-icon" viewBox="0 0 24 24">
                <rect x="5" y="2" width="14" height="20" rx="2"/>
                <path d="M8 6h8M8 11h1m6 0h1m-8 4h1m6 0h1m-8 4h1m6 0h1"/>
            </symbol>
        </defs>
    </svg>

    <main>
        <header>
            <div>
                <h1>Loan Simulator</h1>
                <p class="muted intro" data-i18n="intro"></p>
            </div>

            <div class="language">
                <label for="language" data-i18n="language"></label>
                <select id="language">
                    <option value="es" lang="es">Español</option>
                    <option value="en" lang="en">English</option>
                </select>
            </div>
        </header>

        <section class="panel" id="input-panel" aria-labelledby="form-title">
            <h2 id="form-title" data-i18n="formTitle"></h2>

            <form id="loan-form" novalidate>
                <div class="fields">
                    <div>
                        <label for="amount">
                            <svg aria-hidden="true">
                                <use href="#loan-icon"/>
                            </svg>
                            <span data-i18n="amount"></span>
                        </label>
                        <input id="amount" type="number" min="0" step="any" required>
                    </div>

                    <div>
                        <label for="rate">
                            <svg aria-hidden="true">
                                <use href="#percent-icon"/>
                            </svg>
                            <span data-i18n="rate"></span>
                        </label>
                        <input id="rate" type="number" min="0" step="any" required>
                    </div>

                    <div>
                        <label for="rate-type" data-i18n="rateType"></label>
                        <select id="rate-type">
                            <option value="monthly" data-i18n="monthly"></option>
                            <option value="annual" data-i18n="annual"></option>
                        </select>
                    </div>

                    <div>
                        <label for="months">
                            <svg aria-hidden="true">
                                <use href="#calendar-icon"/>
                            </svg>
                            <span data-i18n="months"></span>
                        </label>
                        <input id="months" type="number" min="1" step="1" required>
                    </div>
                </div>

                <button class="calculate" type="submit">
                    <svg aria-hidden="true">
                        <use href="#calculator-icon"/>
                    </svg>
                    <span data-i18n="calculate"></span>
                </button>

                <p id="error" class="error" role="alert"></p>
            </form>
        </section>

        <section id="results" hidden aria-labelledby="results-title">
            <h2 id="results-title" data-i18n="results"></h2>

            <div class="actions">
                <button
                    id="print-button"
                    type="button"
                    class="secondary"
                    data-i18n="print">
                </button>

                <button
                    id="pdf-button"
                    type="button"
                    data-i18n="pdf">
                </button>
            </div>

            <p id="export-error" class="error" role="alert"></p>

            <div class="panel details">
                <h2 data-i18n="formTitle"></h2>

                <dl>
                    <div>
                        <dt data-i18n="amount"></dt>
                        <dd id="report-amount"></dd>
                    </div>
                    <div>
                        <dt data-i18n="rate"></dt>
                        <dd id="report-rate"></dd>
                    </div>
                    <div>
                        <dt data-i18n="rateType"></dt>
                        <dd id="report-type"></dd>
                    </div>
                    <div>
                        <dt data-i18n="months"></dt>
                        <dd id="report-months"></dd>
                    </div>
                </dl>
            </div>

            <div class="summary">
                <div class="card">
                    <p data-i18n="payment"></p>
                    <strong id="monthly-payment"></strong>
                </div>
                <div class="card">
                    <p data-i18n="totalPaid"></p>
                    <strong id="total-paid"></strong>
                </div>
                <div class="card">
                    <p data-i18n="totalInterest"></p>
                    <strong id="total-interest"></strong>
                </div>
            </div>

            <div class="panel">
                <div
                    class="table-wrap"
                    tabindex="0"
                    role="region"
                    aria-labelledby="table-title">
                    <table>
                        <caption id="table-title" data-i18n="schedule"></caption>
                        <thead>
                            <tr>
                                <th scope="col" data-i18n="period"></th>
                                <th scope="col" data-i18n="initialBalance"></th>
                                <th scope="col" data-i18n="installment"></th>
                                <th scope="col" data-i18n="interest"></th>
                                <th scope="col" data-i18n="principal"></th>
                                <th scope="col" data-i18n="finalBalance"></th>
                            </tr>
                        </thead>
                        <tbody id="schedule"></tbody>
                    </table>
                </div>

                <p class="muted note" data-i18n="decimals"></p>
            </div>
        </section>
    </main>
</body>
</html>
